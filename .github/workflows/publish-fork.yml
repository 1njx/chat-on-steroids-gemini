name: Publish release (Gemini edition fork)

# The fork's own release path. Upstream's publish.yml also signs a Firefox add-on with Mozilla
# secrets this fork does not have; everything else is the same pipeline (release.yml builds and
# smoke-tests every target, then the checksums are re-verified before and after publishing).
#
# Dispatch at the tag to release:
#   gh workflow run publish-fork.yml --ref v2.2.14
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-fork-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    if: github.repository == '1njx/chat-on-steroids-gemini'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Refuse to publish from anything but a tag
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "publish-fork.yml must be dispatched at a tag; got $GITHUB_REF_TYPE $TAG" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify tag matches every version declaration
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const manifest = require('./extension/manifest.json');
          const app = fs.readFileSync('src/main/version.ts', 'utf8').match(/APP_VERSION = '([^']+)'/)?.[1];
          const versions = [pkg.version, lock.version, lock.packages?.['']?.version, manifest.version, app];
          if (versions.some(v => v !== pkg.version)) throw new Error(`Release versions disagree: ${versions.join(', ')}`);
          if (process.env.TAG !== `v${pkg.version}`) throw new Error(`Tag ${process.env.TAG} does not match ${pkg.version}`);
          if (fs.readFileSync('CHANGELOG.md', 'utf8').match(/^## \[(\d+\.\d+\.\d+)\]/m)?.[1] !== pkg.version) throw new Error('Top changelog entry does not match');
          if (!/^## .+$/m.test(fs.readFileSync(`docs/release-notes/v${pkg.version}.md`, 'utf8'))) throw new Error('Release notes have no title');
          NODE
      - name: Verify public-history privacy
        run: node scripts/verify-public-history.mjs
      - name: Refuse an existing release
        run: node scripts/check-release-absent.mjs

  candidate:
    name: Build candidate
    needs: preflight
    uses: ./.github/workflows/release.yml

  publish:
    name: Publish
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chat-on-steroids-candidate-${{ github.run_id }}
          path: publish
      - name: Re-verify the checksums
        working-directory: publish
        run: |
          set -euo pipefail
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish the release
        run: |
          set -euo pipefail
          node scripts/check-release-absent.mjs
          gh release create "$TAG" publish/Chat-On-Steroids-* publish/SHA256SUMS.txt \
            --title "$(sed -n 's/^## //p' "docs/release-notes/$TAG.md" | head -n 1)" \
            --notes-file "docs/release-notes/$TAG.md"
          gh release view "$TAG" --json url --jq .url

  verify:
    name: Verify published files
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download every published asset and check it against SHA256SUMS.txt
        run: |
          set -euo pipefail
          mkdir published && cd published
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          sha256sum -c SHA256SUMS.txt
          ls -l
